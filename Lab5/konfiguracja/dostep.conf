# Wlasne reguly dostepu do zadan 1-3 wpisz ponizej.
# Sciezki Directory odnosza sie do systemu plikow kontenera.

# ---------------------------------------------------------------------------
# Zadanie 1 - dostep do katalogow
# ---------------------------------------------------------------------------
# materialy: wylacz liste plikow (autoindex), ale pozostaw dostep do pliku
# po jego pelnym adresie URL. "Options -Indexes" odejmuje tylko jedna opcje
# (liste), nie blokujac samego odczytu zasobu.
<Directory "/usr/local/apache2/htdocs/materialy">
    Options -Indexes
</Directory>

# wewnetrzne: zablokuj caly dostep przez HTTP, takze do znanego plan.txt.
# "Require all denied" odrzuca kazde zadanie z kodem 403 - to blokada
# dostepu, a nie tylko ukrycie listy.
<Directory "/usr/local/apache2/htdocs/wewnetrzne">
    Require all denied
</Directory>

# ---------------------------------------------------------------------------
# Zadanie 2 - katalog panel chroniony haslem (HTTP Basic)
# ---------------------------------------------------------------------------
# Basic sklada sie z: typu (AuthType), nazwy obszaru (AuthName), bazy
# uzytkownikow (AuthUserFile - plik w kontenerze, nie na hoscie) oraz warunku
# dostepu (Require). Dostep tylko dla poprawnie uwierzytelnionych kont z bazy.
<Directory "/usr/local/apache2/htdocs/panel">
    AuthType Basic
    AuthName "Laboratorium 5"
    AuthUserFile /auth/uzytkownicy
    Require valid-user
</Directory>

# ---------------------------------------------------------------------------
# Zadanie 3 - katalog cgi-bin chroniony tym samym mechanizmem Basic
# ---------------------------------------------------------------------------
# Uwierzytelnienie w serwerze WWW decyduje o dostepie po HTTP, ale NIE zmienia
# tozsamosci systemowej procesu CGI (nadal EUID/EGID = daemon). Dlatego wynik
# odczytu plikow jest taki sam jak bez logowania.
<Directory "/usr/local/apache2/cgi-bin">
    AuthType Basic
    AuthName "Laboratorium 5"
    AuthUserFile /auth/uzytkownicy
    Require valid-user
</Directory>
